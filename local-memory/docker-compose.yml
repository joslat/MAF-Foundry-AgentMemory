# Dedicated Neo4j for the MAF + Foundry + AgentMemory demo.
# Ports are published on 127.0.0.1 only: never expose Neo4j through the tunnel.
services:
  neo4j:
    image: neo4j:5.26
    container_name: maf-foundry-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/maf-foundry-demo
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - maf-foundry-neo4j-data:/data
      - maf-foundry-neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "maf-foundry-demo", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  maf-foundry-neo4j-data:
  maf-foundry-neo4j-logs:
